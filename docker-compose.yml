services:
  fastapi-app:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      # Pass database URL from .env file
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

networks:
  app-network:
    driver: bridge